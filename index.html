<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIDO RABI ORA IKI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="judul">SIDO RABI ORA IKI</h1>

<div class="container">

    <!-- Input Pasangan -->
    <div class="card">
        <h2>Kalkulator Weton Jodoh</h2>

        <label>Nama Kamu:</label>
        <input type="text" id="namaA">

        <label>Tanggal Lahir Kamu:</label>
        <input type="date" id="tglA">

        <label>Nama Pasangan:</label>
        <input type="text" id="namaB">

        <label>Tanggal Lahir Pasangan:</label>
        <input type="date" id="tglB">

        <button onclick="hitungWeton()">Hitung Kecocokan</button>
    </div>

    <!-- Hasil -->
    <div class="card" id="hasilCard" style="display:none;">
        <h2>Hasil Perhitungan</h2>
        <p id="hasilText"></p>
    </div>

    <!-- Card Solusi -->
    <div class="card" id="solusiCard" style="display:none;">
        <h2>Solusi & Hari Baik</h2>
        <p id="solusiText"></p>
        <p id="hariBaikText"></p>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
